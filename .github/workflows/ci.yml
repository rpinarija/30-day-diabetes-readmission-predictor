name: CI

# Run on every push to master and on every pull request targeting it.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: jobs only read the repo unless they ask for more.
permissions:
  contents: read

# If you push again while a run is still going, cancel the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true

      # --locked fails the build if uv.lock is out of date with pyproject.toml,
      # so CI always tests exactly the dependency versions that were committed.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # Fails if any file isn't formatted; fix locally with `uv run ruff format .`
      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  # Train the model from the pinned public dataset, gate it on quality, build the image,
  # and smoke-test it. Pull requests run all of this; only pushes to master publish the
  # image to GitHub Container Registry, so the release path is tested before it merges.
  release:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install runtime dependencies
        run: uv sync --locked --no-dev

      - name: Download dataset (checksum-verified)
        run: uv run python scripts/download_data.py

      - name: Train
        run: uv run python -m readmission.train

      - name: Quality gate
        run: uv run python -m readmission.quality_gate

      # Keep every run's metrics and plots, pass or fail, for traceability.
      - name: Upload training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs-${{ github.sha }}
          path: |
            models/metrics.json
            models/*.png
          if-no-files-found: ignore

      - uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 8000:8000 "${IMAGE}:sha-${GITHUB_SHA}"
          uv run python scripts/smoke_test.py http://127.0.0.1:8000 || { docker logs api; exit 1; }

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push'
        run: docker push --all-tags "${IMAGE}"
