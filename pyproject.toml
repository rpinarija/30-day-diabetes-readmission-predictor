[project]
name = "30-day-diabetes-readmission-predictor"
version = "0.1.0"
description = "30-day hospital readmission risk prediction for diabetic patients (UCI Diabetes 130-US Hospitals dataset)"
readme = "README.md"
authors = [
    { name = "rpinarija", email = "pinarijar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "numpy>=2.5.1",
    "scipy>=1.16.3",
    "scikit-learn>=1.9.0",
    # CPU-only build of XGBoost: same `import xgboost`, without ~580 MB of GPU libraries
    # this service never uses. Held at 3.3.x, the version the current model was trained
    # with; upgrade deliberately, with a retrain and full evaluation.
    "xgboost-cpu>=3.3.0,<3.4",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.1",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.1",
    "ipykernel>=7.3.0",
    "seaborn>=0.13.2",
    "jupytext>=1.19.5",
    "nbconvert>=7.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.build-backend]
module-name = "readmission"

[project.scripts]
30-day-diabetes-readmission-predictor = "readmission.train:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
